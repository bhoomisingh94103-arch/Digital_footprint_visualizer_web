{% extends "base.html" %}

{% block title %}Set New Password — Digital Footprint Intelligence{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full glass-panel p-8 rounded-2xl relative border border-forest-700/60 shadow-[0_20px_50px_rgba(0,0,0,0.6)]">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-forest-900/60 border border-emerald-500/30 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-950/40">
                <i data-lucide="key" class="w-6 h-6 text-mint-400"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Choose New Password</h2>
            <p class="text-xs text-slate-400 mt-1">
                Enter your reset code and set a strong, unique replacement password.
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label for="otp_code" class="block text-xs font-medium text-slate-300 mb-1.5">Reset OTP Code</label>
                <input type="text" id="otp_code" name="otp_code" required maxlength="8" placeholder="6-digit code"
                       class="w-full text-center tracking-widest font-mono text-lg py-2.5 px-4 rounded-xl bg-forest-950 border border-forest-700 text-mint-400 focus:outline-none focus:border-emerald-400">
            </div>

            <div>
                <label for="new_password" class="block text-xs font-medium text-slate-300 mb-1.5">New Password (8+ characters)</label>
                <input type="password" id="new_password" name="new_password" required autocomplete="new-password" placeholder="••••••••••••"
                       class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-forest-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-medium text-slate-300 mb-1.5">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="••••••••••••"
                       class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950 border border-forest-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" class="w-full btn-cyber-primary py-3 rounded-xl font-semibold text-sm shadow-lg">
                Update Password & Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}

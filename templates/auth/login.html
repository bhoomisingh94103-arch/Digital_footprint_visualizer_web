{% extends "base.html" %}

{% block title %}Log In — Digital Footprint Intelligence{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full glass-panel p-8 rounded-3xl relative overflow-hidden">
        <!-- Subtle Emerald Glow -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-[#0d2216] border border-emerald-800 flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i data-lucide="lock" class="w-6 h-6 text-mint-400"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Access Your Vault</h2>
            <p class="text-xs text-slate-400 mt-1">Sign in to review historical scans and track security recommendations.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label for="login_id" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider font-mono">Email or Username</label>
                <input type="text" id="login_id" name="login_id" value="{{ login_id or '' }}" required autocomplete="username"
                       placeholder="user@example.com or username"
                       class="w-full px-3.5 py-2.5 rounded-xl bg-[#030805] border border-[#143321] text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-colors">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider font-mono">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-xs text-emerald-400 hover:text-emerald-300 hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       placeholder="••••••••••••"
                       class="w-full px-3.5 py-2.5 rounded-xl bg-[#030805] border border-[#143321] text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-colors">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded bg-[#030805] border-[#143321] text-emerald-500 focus:ring-0">
                <label for="remember" class="ml-2 text-xs text-slate-400 cursor-pointer">Remember this secure device for 7 days</label>
            </div>

            <button type="submit" class="w-full btn-cyber-primary py-3 rounded-xl font-semibold text-sm shadow-lg mt-2">
                Authorize & Sign In
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-[#143321] text-center">
            <p class="text-xs text-slate-400">
                Don't have an account yet? 
                <a href="{{ url_for('auth.signup') }}" class="text-emerald-400 font-semibold hover:underline">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Forgot Password — Digital Footprint Intelligence{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full glass-panel p-8 rounded-2xl relative border border-forest-700/60 shadow-[0_20px_50px_rgba(0,0,0,0.6)]">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-forest-900/60 border border-emerald-500/30 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-950/40">
                <i data-lucide="shield-question" class="w-6 h-6 text-mint-400"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Reset Account Access</h2>
            <p class="text-xs text-slate-400 mt-1">Enter your registered email address to receive a secure password reset OTP.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Registered Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="user@example.com"
                       class="w-full px-3.5 py-2.5 rounded-xl bg-forest-950/80 border border-forest-700/70 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition-colors">
            </div>

            <button type="submit" class="w-full btn-cyber-primary py-3 rounded-xl font-semibold text-sm shadow-lg">
                Send Reset Passcode
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-forest-800/80 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-xs text-slate-400 hover:text-mint-300 transition-colors">
                ← Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
